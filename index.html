<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon animal</title>
<style>
:root{
  --fond:#efe6d8; --texte:#25233a; --carte:#ffffff; --trait:#cfcbe0; --accent:#4b5fa8; --accent-texte:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --fond:#241d2b; --texte:#ecebf6; --carte:#2a2736; --trait:#403c55; --accent:#8ea0dd; --accent-texte:#14122a; }
}
:root[data-theme="dark"]{ --fond:#241d2b; --texte:#ecebf6; --carte:#2a2736; --trait:#403c55; --accent:#8ea0dd; --accent-texte:#14122a; }
html,body{ height:100%; margin:0; }
body{ background:var(--fond); display:flex; align-items:center; justify-content:center; }
#jeu{ width:min(100vw, calc((100vh - 100px) * 5 / 6)); max-width:100%; display:flex; flex-direction:column; gap:10px; padding:0 8px; box-sizing:border-box; }
#piece{
  width:100%;
  aspect-ratio:5/6;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  display:block;
}
#scene{ position:relative; container-type:inline-size; }
#infobulle{ position:absolute; z-index:2; box-sizing:border-box; width:24cqw; padding:1.2cqw; background:#ffffff; color:#25233a;
  border:0.55cqw solid #3b2a2a; border-radius:1cqw; display:flex; flex-direction:column; align-items:center; gap:0.9cqw; }
#infobulle[hidden]{ display:none; }
.pensee{ position:absolute; z-index:1; pointer-events:none; box-sizing:border-box; width:8.2cqw; height:8.2cqw; padding:1.1cqw; background:#ffffff; border:0.55cqw solid #3b2a2a; border-radius:1cqw; }
.pensee[hidden]{ display:none; }
.pensee canvas{ width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
.pensee::before{ content:""; position:absolute; left:1.1cqw; bottom:-1.25cqw; width:1.6cqw; height:1.6cqw; background:#ffffff; border-right:0.55cqw solid #3b2a2a; border-bottom:0.55cqw solid #3b2a2a; transform:rotate(45deg); box-sizing:border-box; }
#infobulle::before{ content:""; position:absolute; top:calc(var(--queue, 10cqw) - 1cqw); width:2cqw; height:2cqw; background:#ffffff; transform:rotate(45deg); box-sizing:border-box; }
#infobulle.a-droite::before{ left:-1.4cqw; border-left:0.55cqw solid #3b2a2a; border-bottom:0.55cqw solid #3b2a2a; }
#infobulle.a-gauche::before{ right:-1.4cqw; border-top:0.55cqw solid #3b2a2a; border-right:0.55cqw solid #3b2a2a; }
#infobulle-nom{ font:700 clamp(10px, 2.6cqw, 13px)/1.2 system-ui, sans-serif; }
#jauges{ display:flex; flex-direction:column; gap:0.6cqw; align-items:center; }
.besoin{ display:flex; gap:0.4cqw; }
.besoin canvas{ width:3.6cqw; height:3.6cqw; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
#actions-bulle{ display:flex; flex-direction:column; gap:0.5cqw; width:100%; }
#nourrir, #jouer, #coucher, #soigner{ font:700 clamp(10px, 2.6cqw, 13px)/1 system-ui, sans-serif; min-height:clamp(22px, 4.2cqw, 32px); padding:0 1.4cqw; border-radius:0.8cqw; border:0; background:var(--accent); color:var(--accent-texte); cursor:pointer; width:100%; }
#nourrir:disabled, #jouer:disabled, #coucher:disabled, #soigner:disabled{ opacity:.5; cursor:default; }
#nourrir:focus-visible, #jouer:focus-visible, #coucher:focus-visible, #soigner:focus-visible{ outline:3px solid #25233a; outline-offset:2px; }
#mini{ position:absolute; z-index:3; left:6cqw; right:6cqw; top:50%; transform:translateY(-50%); box-sizing:border-box; padding:3cqw; background:#ffffff; color:#25233a;
  border:0.7cqw solid #3b2a2a; border-radius:1.2cqw; display:flex; flex-direction:column; align-items:center; gap:2.5cqw; }
#mini[hidden]{ display:none; }
#mini-titre{ font:700 clamp(13px, 4.2cqw, 20px)/1.2 system-ui, sans-serif; }
#mini-plateau{ position:relative; width:70cqw; height:50cqw; }
#mini-etat{ font:600 clamp(11px, 3.4cqw, 16px)/1.3 system-ui, sans-serif; min-height:2.6em; text-align:center; }
.poste{ position:absolute; bottom:0; left:0; width:22cqw; height:28cqw; padding:0; border:0; background:none; cursor:pointer;
  transform:translateX(calc(var(--place) * 24cqw)); transition:transform .38s ease; }
.poste:disabled{ cursor:default; }
.poste:focus-visible{ outline:3px solid #25233a; outline-offset:2px; }
.poste canvas{ position:absolute; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
.poste .cup{ left:0; bottom:0; width:22cqw; height:23.8cqw; transition:transform .4s ease; }
.poste.leve .cup{ transform:translateY(-75%); }
.poste .balle{ left:7cqw; bottom:0.5cqw; width:8cqw; height:6.7cqw; }
#debut{ position:absolute; z-index:4; inset:3cqw; box-sizing:border-box; padding:3cqw; background:#ffffff; color:#25233a; border:0.7cqw solid #3b2a2a; border-radius:1.2cqw; display:flex; flex-direction:column; align-items:center; gap:2cqw; overflow:auto; }
#debut[hidden]{ display:none; }
#debut-titre{ font:700 clamp(13px, 4.4cqw, 20px)/1.2 system-ui, sans-serif; text-align:center; }
#debut-corps{ width:100%; flex:1; display:flex; flex-direction:column; align-items:center; gap:2cqw; }
#debut-actions{ display:flex; gap:2cqw; }
#actions-jeu{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
.d-bouton{ font:700 clamp(11px, 3.4cqw, 16px)/1 system-ui, sans-serif; min-height:clamp(32px, 7cqw, 44px); padding:0 4cqw; border-radius:1cqw; border:0; background:var(--accent); color:var(--accent-texte); cursor:pointer; }
#adopter, #souvenirs, #joueurs, #visite-retour{ font-size:1rem; min-height:44px; padding:0 22px; }
#souvenirs, #joueurs{ background:transparent; color:var(--texte); border:2px solid var(--trait); }
#visite-barre{ display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; font:700 1rem/1.2 system-ui, sans-serif; color:var(--texte); }
#visite-barre[hidden]{ display:none; }
.champ-compte{ font:600 clamp(14px, 4cqw, 18px)/1.2 system-ui, sans-serif; padding:1.4cqw 2cqw; border:0.5cqw solid #cfcbe0; border-radius:1cqw; width:60cqw; max-width:100%; text-align:center; box-sizing:border-box; color:#25233a; background:#fff; }
.d-erreur{ color:#a32f2f; font:600 clamp(11px, 3.2cqw, 15px)/1.3 system-ui, sans-serif; text-align:center; min-height:1.3em; }
.d-joueur{ width:100%; display:flex; justify-content:space-between; align-items:center; gap:2cqw; padding:1.4cqw 2.4cqw; border:0.5cqw solid #cfcbe0; border-radius:1cqw; background:#faf9fd; color:#25233a; font:600 clamp(12px, 3.6cqw, 17px)/1.2 system-ui, sans-serif; cursor:pointer; box-sizing:border-box; }
.d-joueur:disabled{ opacity:.6; cursor:default; }
.d-liste{ width:100%; display:flex; flex-direction:column; gap:1.2cqw; }
.d-prive{ display:flex; align-items:center; gap:1.6cqw; font:600 clamp(12px, 3.6cqw, 17px)/1.2 system-ui, sans-serif; }
.d-prive input{ width:5cqw; height:5cqw; }
.d-bouton.second{ background:transparent; color:#25233a; border:0.4cqw solid #cfcbe0; }
.d-bouton:disabled{ opacity:.45; cursor:default; }
.d-bouton:focus-visible, .d-carte:focus-visible{ outline:3px solid #25233a; outline-offset:2px; }
.d-grille{ display:grid; grid-template-columns:repeat(4, 1fr); gap:1.6cqw; width:100%; }
.d-carte{ display:flex; flex-direction:column; align-items:center; gap:0.6cqw; padding:1cqw 0.4cqw; border:0.5cqw solid #cfcbe0; border-radius:1cqw; background:#faf9fd; cursor:pointer; font:600 clamp(9px, 2.6cqw, 13px)/1.1 system-ui, sans-serif; color:#25233a; }
.d-carte[aria-pressed="true"]{ border-color:#4b5fa8; box-shadow:0 0 0 0.4cqw #4b5fa8; background:#eef1ff; }
.d-carte:disabled{ opacity:.5; cursor:default; }
.d-carte canvas{ width:16.5cqw; height:12.75cqw; image-rendering:pixelated; image-rendering:crisp-edges; background:#e7e3d6; border-radius:0.8cqw; }
.d-rang{ display:flex; gap:2cqw; justify-content:center; width:100%; }
.d-rang .d-carte{ min-width:24cqw; }
#d-nom{ font:600 clamp(14px, 4cqw, 18px)/1.2 system-ui, sans-serif; padding:1.4cqw 2cqw; border:0.5cqw solid #cfcbe0; border-radius:1cqw; width:60cqw; max-width:100%; text-align:center; box-sizing:border-box; color:#25233a; background:#ffffff; }
.d-grille.souvenirs{ grid-template-columns:repeat(3, 1fr); }
.d-carte.souvenir{ cursor:default; padding:1.4cqw 0.8cqw; }
.d-carte.souvenir .nom{ font-weight:700; }
.d-carte.souvenir .detail{ font-weight:500; color:#6a6783; }
.d-aide{ font:500 clamp(10px, 2.8cqw, 14px)/1.3 system-ui, sans-serif; color:#6a6783; text-align:center; }
</style>
</head>
<body>
<div id="jeu">
  <div id="scene">
    <canvas id="piece" width="80" height="96" role="img" aria-label="Une pièce avec des animaux"></canvas>
    <div id="infobulle" role="group" aria-label="Besoins de l’animal" hidden>
      <div id="infobulle-nom"></div>
      <div id="jauges"></div>
      <div id="actions-bulle">
        <button id="nourrir" type="button">Nourrir</button>
        <button id="jouer" type="button">Jouer</button>
        <button id="coucher" type="button">Coucher</button>
        <button id="soigner" type="button">Soigner</button>
      </div>
    </div>
    <div id="mini" role="dialog" aria-modal="true" aria-labelledby="mini-titre" hidden>
      <div id="mini-titre">Où est la balle ?</div>
      <div id="mini-plateau"></div>
      <div id="mini-etat" aria-live="polite"></div>
    </div>
    <div id="debut" role="dialog" aria-modal="true" aria-labelledby="debut-titre" hidden>
      <div id="debut-titre"></div>
      <div id="debut-corps"></div>
      <div id="debut-actions"></div>
    </div>
  </div>
  <div id="actions-jeu"><button id="adopter" class="d-bouton" type="button" hidden>Adopter un animal</button><button id="souvenirs" class="d-bouton" type="button" hidden>Souvenirs</button><button id="joueurs" class="d-bouton" type="button" hidden>Joueurs</button><div id="visite-barre" hidden><span id="visite-nom"></span><button id="visite-retour" class="d-bouton" type="button">Retour à ma pièce</button></div></div>
</div>

  function quitterVisite(){
    if (!visite) return;
    visite.animaux.forEach(function(a){ a.parti = true; clearInterval(a.tailTimer); });
    visite = null; barreVisite.hidden = true;
    majAdopter(); majSouvenirs(); majPanneau(); draw();
  }
  boutonJoueurs.addEventListener('click', function(){ if (!debutOuvert && !miniOuvert && !visite) ouvrirJoueurs(); });
  document.getElementById('visite-retour').addEventListener('click', quitterVisite);

  function demarrerEnLigne(){
    if (!EN_LIGNE){ ouvrirDebut(true); return; }
    session = lireSession();
    if (session && session.id && session.refresh){
      ouvrirChargement('Chargement…');
      jetonValide().then(function(j){ if (j) apresConnexion(); else ouvrirConnexion(); });
    } else { session = null; ouvrirConnexion(); }
  }
  demarrerEnLigne();
})();
</script>
</body>
</html>
